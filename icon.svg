    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16584C"/>
      <stop offset="1" stop-color="#0C3A33"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" fill="url(#mat)"/>
